name: Build

# Every push builds the plugin. Pushing a version tag (for example v0.1.0)
# also publishes it as a GitHub Release, so anyone with access can download it.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Build
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Stream-Bridge-VST3
          path: build/StreamBridge_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          Compress-Archive -Path "build/StreamBridge_artefacts/Release/VST3/Stream Bridge.vst3" -DestinationPath "Stream-Bridge-$env:TAG.zip"
          $notes = @(
            "1. Unzip and copy the ``Stream Bridge.vst3`` folder to ``C:\Program Files\Common Files\VST3\``."
            "2. Rescan plugins in your DAW."
            "3. Put **Stream Bridge** on the Master channel and pick your virtual cable as Output."
            ""
            "Needs 64-bit Windows and a virtual audio cable (for example VB-Audio Virtual Cable)."
          ) -join "`n"
          gh release create "$env:TAG" "Stream-Bridge-$env:TAG.zip" --title "Stream Bridge $env:TAG" --notes "$notes"
